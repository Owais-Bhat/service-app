<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Networking Experts – Service Portal</title>
  <meta name="description" content="Networking Experts Client & Staff Portal – Manage tickets, services, and network infrastructure." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
  <meta name="theme-color" content="#0f172a" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/favicon.svg" />
</head>
<body>
  <div id="app">
    <!-- Instant inline splash so users never see a blank white screen while the
         app bundle downloads on a slow connection. main.js replaces #app. -->
    <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f172a;">
      <div style="width:44px;height:44px;border:4px solid rgba(255,255,255,0.18);border-top-color:#10b981;border-radius:50%;animation:nest-spin .8s linear infinite;"></div>
    </div>
  </div>
  <style>@keyframes nest-spin{to{transform:rotate(360deg)}}</style>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
